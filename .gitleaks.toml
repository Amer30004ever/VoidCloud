# Void Cloud gitleaks config.
# Extends the built-in default ruleset (AWS, GCP, Stripe, JWT, PEM keys, etc.)
# and adds project-specific patterns + allowlists.

[extend]
useDefault = true

[[rules]]
id = "voidcloud-proxmox-token"
description = "Proxmox API token secret (UUID form) in a real config"
regex = '''PROXMOX_TOKEN_SECRET\s*[:=]\s*["']?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}["']?'''
tags = ["proxmox", "secret"]

[[rules]]
id = "voidcloud-smtp-password"
description = "SMTP_PASS with a non-placeholder value"
regex = '''SMTP_PASS\s*[:=]\s*["']?(?!(REPLACE_ME|your_|\$\{|<))[A-Za-z0-9 !@#$%^&*()_+\-=/.,;:\?]{6,}["']?'''
tags = ["smtp"]

[[rules]]
id = "voidcloud-jwt-secret"
description = "JWT_SECRET with a base64/hex value in a committed file"
regex = '''JWT_SECRET\s*[:=]\s*["']?(?!(REPLACE_ME|your_|dev_secret|change_me|\$\{|<))[A-Za-z0-9+/=]{24,}["']?'''
tags = ["jwt"]

[allowlist]
description = "Placeholders, examples, docs, generated files, third-party vendor"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''\.example$''',
  '''\.example\.(ya?ml|json|env)$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)docs/''',
  '''(^|/)sub2api-main/''',
  '''(^|/)attached_assets/''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''bun\.lock$''',
  '''(^|/)\.ci-selftest/''',
]
regexes = [
  '''REPLACE_ME''',
  '''your_[a-z_]+_here''',
  '''change[_-]me''',
  '''dev_secret_key_for_local_development_only''',
  '''fallback_secret''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]
