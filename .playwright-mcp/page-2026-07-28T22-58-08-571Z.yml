      - generic [ref=e367]:
        - heading "Frequently Asked Questions" [level=2] [ref=e369]
        - generic [ref=e370]:
          - generic [ref=e371]:
            - button "What's the difference between VoidCloud and AWS/Vercel? +" [ref=e372]:
              - generic [ref=e373]: What's the difference between VoidCloud and AWS/Vercel?
              - generic [ref=e374]: +
            - paragraph [ref=e377]: VoidCloud offers managed Kubernetes with Egyptian payment support (Fawry/InstaPay), local pricing in EGP, and lower latency for Middle East traffic. We're 60% cheaper than AWS for equivalent resources. Unlike Vercel, we give you full container control without the complexity of managing your own K8s cluster.
          - generic [ref=e378]:
            - button "Do I need to know Kubernetes? +" [ref=e379]:
              - generic [ref=e380]: Do I need to know Kubernetes?
              - generic [ref=e381]: +
            - paragraph [ref=e382]: No! Our dashboard abstracts all Kubernetes complexity. Click to deploy from GitHub or Docker Hub. We handle the scaling, networking, and security. If you're an advanced user, you can also use kubectl directly â€” we give you full access.
          - generic [ref=e383]:
            - button "How does billing work in Egypt? +" [ref=e384]:
              - generic [ref=e385]: How does billing work in Egypt?
              - generic [ref=e386]: +
            - paragraph [ref=e387]: Pay monthly via Fawry (cards + 3,000+ locations across Egypt), InstaPay (instant bank transfer from any Egyptian bank), or Stripe for international cards. All prices shown in EGP with no hidden fees. VAT is included in the displayed price. You can switch payment methods anytime.
          - generic [ref=e388]:
            - button "Can I use my own domain? +" [ref=e389]:
              - generic [ref=e390]: Can I use my own domain?
              - generic [ref=e391]: +
            - paragraph [ref=e392]: Yes, all paid plans include custom domains. We provision SSL certificates automatically via Let's Encrypt. Simply add your domain in the dashboard, update your DNS records (we provide instructions), and we handle the rest. Usually takes 5 minutes.
          - generic [ref=e393]:
            - button "Is my data backed up? +" [ref=e394]:
              - generic [ref=e395]: Is my data backed up?
              - generic [ref=e396]: +
            - paragraph [ref=e397]: Yes, daily automated backups with one-click restore. Business plans include point-in-time recovery (every 6 hours). Backups are stored redundantly in a separate location. You can also trigger manual backups anytime from the dashboard.
          - generic [ref=e398]:
            - button "Can I migrate away if needed? +" [ref=e399]:
              - generic [ref=e400]: Can I migrate away if needed?
              - generic [ref=e401]: +
            - paragraph [ref=e402]: Absolutely. You own your code and data 100%. Export via GitHub (your code is already there) or use kubectl to pull your manifests anytime. We provide migration guides to other providers. No vendor lock-in, no hidden exit fees.
          - generic [ref=e403]:
            - button "What happens after the 7-day free trial? +" [ref=e404]:
              - generic [ref=e405]: What happens after the 7-day free trial?
              - generic [ref=e406]: +
            - paragraph [ref=e407]: After 7 days, your deployments will be paused until you upgrade to a paid plan. We never charge you automatically. You'll receive email reminders at day 5 and day 7. You can extend your trial once by contacting support.
          - generic [ref=e408]:
            - button "Is there a team/organization plan? +" [ref=e409]:
              - generic [ref=e410]: Is there a team/organization plan?
              - generic [ref=e411]: +
            - paragraph [ref=e412]: Yes! Business plans include team management with up to 5 members. You can invite teammates, set role-based permissions (Admin/Member/Viewer), and share deployments across your team. Contact sales for enterprise plans with more than 5 members.
