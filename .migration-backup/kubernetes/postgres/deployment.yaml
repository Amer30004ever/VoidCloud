apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: voidcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # Bump this to force a pod restart when the secret changes.
        secret-revision: "v2"
    spec:
      # Pin postgres to the node that holds the hostPath volume so the data
      # directory is always the same physical disk.
      nodeSelector:
        kubernetes.io/hostname: workernode01
      securityContext:
        fsGroup: 999
        runAsUser: 999
      initContainers:
        # Ensures the mounted directory is owned by postgres and that any
        # stray `lost+found` (from ext4 mounts) doesn't trick postgres into
        # thinking the data dir is already initialised — which would cause
        # it to silently ignore POSTGRES_PASSWORD and reuse the old creds.
        - name: init-pgdata
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /var/lib/postgresql/data/pgdata
              # Remove filesystem-level junk that isn't a real pg cluster
              rm -rf /var/lib/postgresql/data/lost+found || true
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_DB
            # Use a sub-path under the mount so the cluster lives in a clean
            # directory that the init container created with 0700 perms.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # md5 is more forgiving than scram-sha-256 when clients re-use
            # old connection strings. Only applied on first init.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: md5
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=md5"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - PGPASSWORD="$POSTGRES_PASSWORD" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -c 'SELECT 1' >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
