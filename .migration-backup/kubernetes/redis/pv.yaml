apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
  namespace: voidcloud
  labels:
    app: redis
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/homelab/volumes/voidcloud/redis
    type: DirectoryOrCreate
