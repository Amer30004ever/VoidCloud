# Void Cloud — GitLab CI/CD (Microservices)

variables:
  DOCKER_HUB_REPO: voidcloud
  NAMESPACE: voidcloud
  SERVICES: "auth user tenant vps billing crm whatsapp email notification monitoring audit analytics"

stages:
  - test
  - build
  - deploy
  - migrate

.test-service:
  image: node:20-alpine
  before_script:
    - apk add --no-cache openssl
  script:
    - cd services/$SERVICE
    - npm ci
    - npm run build

test-services:
  stage: test
  parallel:
    matrix:
      - SERVICE: [auth, user, tenant, vps, billing, crm, whatsapp, email, notification, monitoring, audit, analytics]
  extends: .test-service

test-frontend:
  stage: test
  image: node:20-alpine
  variables:
    NEXT_PUBLIC_API_URL: https://api.voidcloud.cc.cd/api/v1
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build

.docker-build:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

build-services:
  stage: build
  extends: .docker-build
  needs: [test-services]
  parallel:
    matrix:
      - SERVICE: [auth, user, tenant, vps, billing, crm, whatsapp, email, notification, monitoring, audit, analytics]
  script:
    - |
      TS=$(date +%Y%m%d-%H%M%S)
      docker build -f services/$SERVICE/Dockerfile \
        -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-${SERVICE}-service:latest \
        -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-${SERVICE}-service:$TS .
      docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-${SERVICE}-service:latest
      docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-${SERVICE}-service:$TS

build-database:
  stage: build
  extends: .docker-build
  needs: [test-services]
  script:
    - |
      TS=$(date +%Y%m%d-%H%M%S)
      docker build -f database/Dockerfile \
        -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-database:latest \
        -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-database:$TS database
      docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-database:latest
      docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-database:$TS

build-frontend:
  stage: build
  extends: .docker-build
  needs: [test-frontend]
  script:
    - |
      TS=$(date +%Y%m%d-%H%M%S)
      docker build -f frontend/Dockerfile \
        -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-frontend:latest \
        -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-frontend:$TS frontend
      docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-frontend:latest
      docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO-frontend:$TS

.k8s:
  tags: [homelab]
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p $HOME/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
    - chmod 600 $HOME/.kube/config

deploy:
  stage: deploy
  extends: .k8s
  needs: [build-services, build-database, build-frontend]
  script:
    - kubectl apply -f kubernetes/namespace.yaml
    - kubectl apply -f kubernetes/secrets.yaml
    - kubectl apply -f kubernetes/configmaps.yaml
    - kubectl apply -f kubernetes/postgres/
    - kubectl apply -f kubernetes/redis/
    - kubectl apply -f kubernetes/rabbitmq/
    - kubectl apply -f kubernetes/cloudflare-tunnel-config.yaml
    - kubectl apply -f kubernetes/ingress.yaml
    - kubectl apply -f kubernetes/traefik-middlewares.yaml
    - for d in auth user tenant vps billing crm whatsapp email notification monitoring audit analytics frontend; do kubectl apply -f kubernetes/$d/; done
    - kubectl -n $NAMESPACE rollout status deploy/auth-service --timeout=180s

migrate:
  stage: migrate
  extends: .k8s
  needs: [deploy]
  script:
    - kubectl delete job voidcloud-db-migrate voidcloud-db-seed -n $NAMESPACE --ignore-not-found
    - kubectl apply -f kubernetes/migrate-job.yaml
    - kubectl -n $NAMESPACE wait --for=condition=complete job/voidcloud-db-migrate --timeout=300s
