kind = "web"
previewPath = "/"
title = "VoidCloud"
version = "1.0.0"
id = "artifacts/voidcloud"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21291

[services.development]
run = "pnpm --filter @workspace/voidcloud run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voidcloud", "run", "build" ]
publicDir = "artifacts/voidcloud/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21291"
BASE_PATH = "/"
