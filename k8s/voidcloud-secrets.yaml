apiVersion: v1
kind: Namespace
metadata:
  name: voidcloud
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: voidcloud
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: void_portal
---
apiVersion: v1
kind: Secret
metadata:
  name: voidcloud-app-secret
  namespace: voidcloud
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres.voidcloud.svc.cluster.local:5432/void_portal
  JWT_SECRET: REPLACE_WITH_REAL_JWT_SECRET_MIN_32_CHARS
  JWT_EXPIRES_IN: "7d"
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USER: REPLACE_WITH_SMTP_USER
  SMTP_PASS: REPLACE_WITH_SMTP_PASS
  EMAIL_FROM: "VoidCloud <REPLACE_WITH_SMTP_USER>"
  PROXMOX_HOST: "REPLACE_WITH_PROXMOX_HOST"
  PROXMOX_TOKEN_ID: "REPLACE_WITH_PROXMOX_TOKEN_ID"
  PROXMOX_TOKEN_SECRET: "REPLACE_WITH_PROXMOX_TOKEN_SECRET"
  PROXMOX_NODE: REPLACE_WITH_PROXMOX_NODE
  PROXMOX_STORAGE: REPLACE_WITH_PROXMOX_STORAGE
  PROXMOX_BRIDGE: REPLACE_WITH_PROXMOX_BRIDGE
  PROXMOX_IP_POOL_CIDR: REPLACE_WITH_PROXMOX_IP_POOL_CIDR
  PROXMOX_GATEWAY: "REPLACE_WITH_PROXMOX_GATEWAY"
