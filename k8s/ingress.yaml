apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voidcloud-ingress
  namespace: voidcloud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: voidcloud-compress@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: voidcloud.cc.cd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.voidcloud.cc.cd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 3001
