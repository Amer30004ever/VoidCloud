apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: voidcloud
data:
  config.yaml: |
    tunnel: b87510bf-f586-42aa-ab0c-b1a24206768a
    no-autoupdate: true
    metrics: 0.0.0.0:2000
    ingress:
      - hostname: voidcloud.cc.cd
        service: http://frontend.voidcloud.svc.cluster.local:3000
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
      - hostname: api.voidcloud.cc.cd
        service: http://auth.voidcloud.svc.cluster.local:3001
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
      - service: http_status:404
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secret
  namespace: voidcloud
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_TUNNEL_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: voidcloud
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secret
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
