apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-secret
  namespace: voidcloud
type: Opaque
stringData:
  credentials.json: |
    {
      "AccountTag": "5974977c768416623e5ec8bf7ba6a070",
      "TunnelID": "b87510bf-f586-42aa-ab0c-b1a24206768a",
      "TunnelSecret": "aMxvEMv+RSf3R+L7b4Ijy/wGM8coix3jE20xeE9tMLs="
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: voidcloud
data:
  config.yaml: |
    tunnel: b87510bf-f586-42aa-ab0c-b1a24206768a
    credentials-file: /etc/cloudflared/credentials.json
    metrics: 0.0.0.0:2000
    ingress:
      - hostname: voidcloud.cc.cd
        service: http://frontend-service:3000
      - hostname: api.voidcloud.cc.cd
        service: http://traefik:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: voidcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          ports:
            - containerPort: 2000
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
            - name: secret
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: cloudflare-tunnel-config
        - name: secret
          secret:
            secretName: cloudflare-tunnel-secret
