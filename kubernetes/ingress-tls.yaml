apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voidcloud-ingress
  namespace: voidcloud
  annotations:
    # Traefik annotations
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
    
    # cert-manager annotations
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: http01
    
    # CORS headers
    traefik.ingress.kubernetes.io/service-cors-headers: |
      Access-Control-Allow-Origin: https://voidcloud.cc.cd
      Access-Control-Allow-Methods: GET,POST,PUT,DELETE,OPTIONS
      Access-Control-Allow-Headers: Content-Type,Authorization
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - voidcloud.cc.cd
        - api.voidcloud.cc.cd
      secretName: voidcloud-tls  # cert-manager will create this
  rules:
    # Frontend rule
    - host: voidcloud.cc.cd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    
    # Backend API rule
    - host: api.voidcloud.cc.cd
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001