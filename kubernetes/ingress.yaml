apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voidcloud-ingress
  namespace: voidcloud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: api.voidcloud.cc.cd
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3002
      - path: /api/v1/tenants
        pathType: Prefix
        backend:
          service:
            name: tenant-service
            port:
              number: 3003
      - path: /api/v1/vps
        pathType: Prefix
        backend:
          service:
            name: vps-service
            port:
              number: 3004
      - path: /api/v1/billing
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 3005
      - path: /api/v1/crm
        pathType: Prefix
        backend:
          service:
            name: crm-service
            port:
              number: 3006
      - path: /api/v1/whatsapp
        pathType: Prefix
        backend:
          service:
            name: openwa-service
            port:
              number: 2785
      - path: /api/v1/email
        pathType: Prefix
        backend:
          service:
            name: email-service
            port:
              number: 3008
      - path: /api/v1/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 3009
      - path: /api/v1/monitoring
        pathType: Prefix
        backend:
          service:
            name: monitoring-service
            port:
              number: 3010
      - path: /api/v1/audit
        pathType: Prefix
        backend:
          service:
            name: audit-service
            port:
              number: 3011
      - path: /api/v1/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 3012
      - path: /api/v1/webhooks
        pathType: Prefix
        backend:
          service:
            name: openwa-service
            port:
              number: 2785
  - host: voidcloud.cc.cd
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
