apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amer-portal-ingress
  namespace: amer-portal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Chain BOTH middlewares (YAML does not allow duplicate keys — comma-separate them)
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-security-headers@kubernetescrd,traefik-rate-limit@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - amer.homelab.com
        - api.amer.homelab.com
      secretName: amer-portal-tls
  rules:
    - host: amer.homelab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.amer.homelab.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
