apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-service-pods
  namespace: voidcloud
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
