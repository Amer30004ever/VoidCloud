apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: voidcloud
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ollama
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
      volumes:
        - name: ollama-storage
          emptyDir: {}
