apiVersion: v1
kind: Secret
metadata:
  name: amer-portal-secrets
  namespace: amer-portal
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: amer_portal
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amer_portal
  
  # JWT Secret
  JWT_SECRET: YzI2ODVjYzktMWJlOC00MWJlLWI5YTItNDAxOWMwMjgzMGRi
  
  # WhatsApp API credentials (configure if needed)
  WHATSAPP_ACCESS_TOKEN: ""
  WHATSAPP_PHONE_NUMBER_ID: ""
  WHATSAPP_WABA_ID: ""
  WHATSAPP_VERIFY_TOKEN: ""
  WEBHOOK_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: amer-portal
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: amer_portal
