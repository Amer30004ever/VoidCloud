apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub2api-service
  namespace: voidcloud
  labels:
    app: sub2api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sub2api-service
  template:
    metadata:
      labels:
        app: sub2api-service
    spec:
      containers:
        - name: sub2api-service
          image: amer30004ever/voidcloud-sub2api-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3013
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3013"
            - name: DATABASE_HOST
              value: "postgres.voidcloud.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_NAME
              value: "void_portal"
            - name: REDIS_HOST
              value: "redis.voidcloud.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              value: "amer30004ever@hotmail.com"
            - name: ADMIN_PASSWORD
              value: "VoidCloud2026!"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3013
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3013
            initialDelaySeconds: 10
            periodSeconds: 5
