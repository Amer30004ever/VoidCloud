apiVersion: v1
kind: ConfigMap
metadata:
  name: amer-portal-config
  namespace: amer-portal
data:
  NODE_ENV: production
  BACKEND_PORT: "3001"
  FRONTEND_PORT: "3000"
  API_URL: http://backend:3001/api/v1
  FRONTEND_URL: https://amer-portal.cc.cd
  NEXT_PUBLIC_API_URL: https://api.amer-portal.cc.cd/api/v1
  CORS_ORIGINS: https://amer-portal.cc.cd,https://www.amer-portal.cc.cd
  # Set after deploying MIP-WA-CRM (e.g. on a customer VPS)
  WA_CRM_FRONTEND_URL: ""
  WA_CRM_API_URL: ""
