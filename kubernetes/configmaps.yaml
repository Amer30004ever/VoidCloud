apiVersion: v1
kind: ConfigMap
metadata:
  name: voidcloud-config
  namespace: voidcloud
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "7d"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  FRONTEND_URL: "https://voidcloud.cc.cd"
  CORS_ORIGINS: "https://voidcloud.cc.cd,https://www.voidcloud.cc.cd"
  NEXT_PUBLIC_API_URL: "https://api.voidcloud.cc.cd/api/v1"
  # Tenant VM network isolation (Prompt 0.15). Override PROXMOX_K8S_INTERNAL_CIDRS
  # to match the real Kubernetes-internal CIDRs in your cluster.
  PROXMOX_K8S_INTERNAL_CIDRS: "10.42.0.0/16,10.43.0.0/16,10.244.0.0/16,10.96.0.0/12,172.16.0.0/12"
  PROXMOX_VLAN_PER_TENANT: "false"
  OLLAMA_URL: "http://ollama.voidcloud.svc.cluster.local:11434"
  OLLAMA_CHAT_MODEL: "llama3.2"
