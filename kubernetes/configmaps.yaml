apiVersion: v1
kind: ConfigMap
metadata:
  name: voidcloud-config
  namespace: voidcloud
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "7d"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  FRONTEND_URL: "https://voidcloud.cc.cd"
  CORS_ORIGINS: "https://voidcloud.cc.cd,https://www.voidcloud.cc.cd"
