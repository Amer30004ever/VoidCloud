apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv
  namespace: voidcloud
  labels:
    app: rabbitmq
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/homelab/volumes/voidcloud/rabbitmq
    type: DirectoryOrCreate
