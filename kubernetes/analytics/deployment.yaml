apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: voidcloud
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: amer30004ever/voidcloud-analytics-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3012
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: NODE_ENV
        - name: PORT
          value: "3012"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: JWT_EXPIRES_IN
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: REDIS_PORT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3012
          initialDelaySeconds: 30
          periodSeconds: 10
