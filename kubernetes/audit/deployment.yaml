apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: voidcloud
  labels:
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
      - name: audit-service
        image: amer30004ever/voidcloud-audit-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3011
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: NODE_ENV
        - name: PORT
          value: "3011"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: DATABASE_URL
        - name: DATABASE_URL_POOLED
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: DATABASE_URL_POOLED
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: JWT_EXPIRES_IN
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: RABBITMQ_PORT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3011
          initialDelaySeconds: 30
          periodSeconds: 10


