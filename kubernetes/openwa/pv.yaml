apiVersion: v1
kind: PersistentVolume
metadata:
  name: openwa-pv
  namespace: voidcloud
  labels:
    app: openwa
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/homelab/volumes/voidcloud/openwa
    type: DirectoryOrCreate
