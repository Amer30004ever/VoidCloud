apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: voidcloud
  labels:
    app: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/homelab/volumes/voidcloud/postgres
    type: DirectoryOrCreate