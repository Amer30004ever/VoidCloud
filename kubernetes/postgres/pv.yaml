apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: amer-portal
  labels:
    app: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/homelab/volumes/amer-portal/postgres
    type: DirectoryOrCreate