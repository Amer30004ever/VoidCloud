apiVersion: batch/v1
kind: CronJob
metadata:
  name: voidcloud-db-restore-drill
  namespace: voidcloud
spec:
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
            - name: restore-drill
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: voidcloud-secrets
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: voidcloud-secrets
                      key: DB_PORT
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: voidcloud-secrets
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: voidcloud-secrets
                      key: DB_USER
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: voidcloud-secrets
                      key: DB_PASS
                - name: BACKUP_DIR
                  value: /backups
                - name: SCRATCH_DB
                  value: voidcloud_restore_test
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: expected-tables
                  mountPath: /etc/voidcloud
                  readOnly: true
                - name: scratch
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  export PGPASSWORD="$DB_PASS"
                  LATEST="$(find "${BACKUP_DIR}" -name 'voidcloud_backup_*.sql.gz' -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
                  if [ -z "${LATEST}" ]; then
                    echo "ERROR: No backup files found in ${BACKUP_DIR}" >&2
                    exit 1
                  fi
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Using backup: ${LATEST}"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Creating scratch database ${SCRATCH_DB}..."
                  dropdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" --if-exists "${SCRATCH_DB}" 2>/dev/null || true
                  createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" "${SCRATCH_DB}"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Restoring backup into ${SCRATCH_DB}..."
                  gunzip -c "${LATEST}" | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "${SCRATCH_DB}"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Verifying restore..."
                  TABLE_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "${SCRATCH_DB}" -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")"
                  ROW_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "${SCRATCH_DB}" -t -A -c "SELECT sum(n_live_tup) FROM pg_stat_user_tables;")"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Restore verification:"
                  echo "  Tables: ${TABLE_COUNT}"
                  echo "  Rows: ${ROW_COUNT}"
                  if [ "${TABLE_COUNT}" -eq 0 ]; then
                    echo "ERROR: Restore verification failed — no tables found in scratch database." >&2
                    exit 1
                  fi
                  EXPECTED_TABLES_FILE=/etc/voidcloud/expected-tables.txt
                  if [ ! -f "$EXPECTED_TABLES_FILE" ]; then
                    echo "ERROR: Expected-tables manifest not mounted at $EXPECTED_TABLES_FILE" >&2
                    exit 1
                  fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "${SCRATCH_DB}" -t -A -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" | sed '/^$/d' | LC_ALL=C sort > /tmp/actual.txt
                  grep -v '^[[:space:]]*$' "$EXPECTED_TABLES_FILE" | grep -v '^#' | LC_ALL=C sort > /tmp/expected.txt
                  LC_ALL=C comm -23 /tmp/expected.txt /tmp/actual.txt > /tmp/missing.txt
                  MISSING_COUNT="$(wc -l < /tmp/missing.txt | tr -d ' ')"
                  echo "  Expected tables: $(wc -l < /tmp/expected.txt | tr -d ' ')"
                  echo "  Missing tables: ${MISSING_COUNT}"
                  if [ "${MISSING_COUNT}" -ne 0 ]; then
                    echo "ERROR: Schema completeness check failed — ${MISSING_COUNT} expected table(s) missing:" >&2
                    sed 's/^/  - /' /tmp/missing.txt >&2
                    exit 1
                  fi
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Schema completeness verified — all expected tables present."
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Restore drill completed successfully."
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Dropping scratch database ${SCRATCH_DB}..."
                  dropdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" "${SCRATCH_DB}"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Restore drill finished."
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: voidcloud-backup-pvc
            - name: expected-tables
              configMap:
                name: voidcloud-expected-tables
            - name: scratch
              emptyDir: {}
