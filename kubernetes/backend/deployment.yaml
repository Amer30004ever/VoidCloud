apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: voidcloud
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Updated by deployment/reset scripts so secret changes restart pods.
        secret-checksum: "manual"
    spec:
      # imagePullSecrets removed — images are public on Docker Hub.
      # Re-add this block only if you push to a private registry.
      serviceAccountName: voidcloud-backend
      initContainers:
        - name: prisma-migrate
          image: amer30004ever/voidcloud-backend:latest  # Will be updated by script
          imagePullPolicy: Always
          command: ["sh", "-c", "npx prisma migrate deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: amer30004ever/voidcloud-backend:latest  # Will be updated by script
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: smtp-secret
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: JWT_SECRET
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: postgres
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: WHATSAPP_ACCESS_TOKEN
                  optional: true
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: WHATSAPP_PHONE_NUMBER_ID
                  optional: true
            - name: WHATSAPP_WABA_ID
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: WHATSAPP_WABA_ID
                  optional: true
            - name: WHATSAPP_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: WHATSAPP_VERIFY_TOKEN
                  optional: true
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: WEBHOOK_SECRET
                  optional: true
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: NODE_ENV
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: FRONTEND_URL
                  optional: true
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: CORS_ORIGINS
                  optional: true
            - name: PROXMOX_HOST
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_HOST
                  optional: true
            - name: PROXMOX_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_TOKEN_ID
                  optional: true
            - name: PROXMOX_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_TOKEN_SECRET
                  optional: true
            - name: PROXMOX_NODE
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_NODE
                  optional: true
            - name: PROXMOX_STORAGE
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_STORAGE
                  optional: true
            - name: PROXMOX_BRIDGE
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_BRIDGE
                  optional: true
            - name: PROXMOX_TEMPLATE
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_TEMPLATE
                  optional: true
            - name: PROXMOX_IP_POOL_CIDR
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_IP_POOL_CIDR
                  optional: true
            - name: PROXMOX_GATEWAY
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: PROXMOX_GATEWAY
                  optional: true
            - name: PROXMOX_VERIFY_TLS
              value: "false"
            - name: WA_CRM_FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: WA_CRM_FRONTEND_URL
                  optional: true
            - name: WA_CRM_API_URL
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: WA_CRM_API_URL
                  optional: true
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 5
