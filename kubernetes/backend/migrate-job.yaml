apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: voidcloud
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: amer30004ever/voidcloud-backend:latest
          imagePullPolicy: Always
          command: ["sh", "/app/scripts/run-migrate.sh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: postgres
