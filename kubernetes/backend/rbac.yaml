apiVersion: v1
kind: ServiceAccount
metadata:
  name: voidcloud-backend
  namespace: voidcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: voidcloud-backend
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces", "services", "deployments", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log", "pods/status"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: voidcloud-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: voidcloud-backend
subjects:
- kind: ServiceAccount
  name: voidcloud-backend
  namespace: voidcloud
