apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-command
  namespace: voidcloud
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prisma
          image: amer30004ever/voidcloud-backend:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "REPLACE_COMMAND"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: postgres
