apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: voidcloud
  labels:
    app.kubernetes.io/name: portainer
    app.kubernetes.io/managed-by: voidcloud-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portainer
    spec:
      containers:
        - name: portainer
          image: portainer/portainer-ce:latest
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command: ["/portainer"]
          args: ["--no-setup-token"]
