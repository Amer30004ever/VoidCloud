apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: voidcloud
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/managed-by: voidcloud-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      containers:
        - name: code-server
          image: codercom/code-server:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AUTH_TYPE
              value: "none"
            - name: VOIDCLOUD_SEMANTIC_SEARCH_OLLAMA_URL
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: OLLAMA_URL
                  optional: true
            - name: VOIDCLOUD_SEMANTIC_SEARCH_EMBEDDING_MODEL
              value: "nomic-embed-text"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
