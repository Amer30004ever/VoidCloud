apiVersion: batch/v1
kind: Job
metadata:
  name: voidcloud-db-migrate
  namespace: voidcloud
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: amer30004ever/voidcloud-auth-service:latest
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL
