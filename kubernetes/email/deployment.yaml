apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: voidcloud
  labels:
    app: email-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
      - name: email-service
        image: amer30004ever/voidcloud-email-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3008
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: NODE_ENV
        - name: PORT
          value: "3008"
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: SMTP_PORT
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: SMTP_USER
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: SMTP_PASS
        - name: EMAIL_FROM
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: EMAIL_FROM
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: RABBITMQ_PORT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 30
          periodSeconds: 10
