apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: voidcloud
  labels:
    app: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: amer30004ever/voidcloud-agent-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3014
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: NODE_ENV
            - name: PORT
              value: "3014"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL
            - name: DATABASE_URL_POOLED
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: DATABASE_URL_POOLED
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voidcloud-secrets
                  key: JWT_SECRET
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: voidcloud-config
                  key: REDIS_PORT
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3014
            initialDelaySeconds: 30
            periodSeconds: 10

