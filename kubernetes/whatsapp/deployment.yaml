apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-service
  namespace: voidcloud
  labels:
    app: whatsapp-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whatsapp-service
  template:
    metadata:
      labels:
        app: whatsapp-service
    spec:
      containers:
      - name: whatsapp-service
        image: amer30004ever/voidcloud-whatsapp-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3007
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: NODE_ENV
        - name: PORT
          value: "3007"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: JWT_SECRET
        - name: WHATSAPP_APP_ID
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_APP_ID
        - name: WHATSAPP_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_APP_SECRET
        - name: WHATSAPP_CLIENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_CLIENT_TOKEN
        - name: WHATSAPP_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_ACCESS_TOKEN
        - name: WHATSAPP_PHONE_NUMBER_ID
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_PHONE_NUMBER_ID
        - name: WHATSAPP_WABA_ID
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_WABA_ID
        - name: WHATSAPP_VERIFY_TOKEN
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_VERIFY_TOKEN
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WEBHOOK_SECRET
        - name: WHATSAPP_SUPPORT_NUMBER
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_SUPPORT_NUMBER
        - name: WHATSAPP_SUPPORT_NUMBER_FORMATTED
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_SUPPORT_NUMBER_FORMATTED
        - name: WHATSAPP_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: voidcloud-secrets
              key: WHATSAPP_WEBHOOK_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: REDIS_PORT
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: voidcloud-config
              key: RABBITMQ_PORT
        # Crash-loop guard tuning (Prompt 0.18)
        - name: CRASHLOOP_WINDOW_MS
          value: "600000"
        - name: CRASHLOOP_THRESHOLD
          value: "5"
        - name: CRASHLOOP_MARKER_PATH
          value: "/tmp/whatsapp-boot.marker"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            # Floor raised from 512Mi so a Puppeteer-based session (openwa)
            # cold start cannot be OOMKilled mid-boot — a prior crash-loop cause.
            memory: "1024Mi"
            cpu: "750m"
        # Startup probe: gives slow cold starts (openwa/Puppeteer) up to 5m
        # before the liveness probe is allowed to kill the pod. This directly
        # addresses the prior crash-loop where a too-aggressive liveness probe
        # killed a pod still legitimately starting up.
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 3007
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3007
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3007
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 4

