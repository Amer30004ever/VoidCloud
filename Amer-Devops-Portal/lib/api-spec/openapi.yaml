          type: string
        requests:
          type: integer
        blocked:
          type: boolean
        country:
          type: ["string", "null"]
        tenantId:
          type: ["integer", "null"]

    TenantRate:
      type: object
      required: [tenantId, tenantName, requestsPerMin]
      properties:
        tenantId:
          type: integer
        tenantName:
          type: string
        requestsPerMin:
          type: number

    BlockIPInput:
      type: object
      required: [ip]
      properties:
        ip:
          type: string
        reason:
          type: string
        duration:
          type: ["integer", "null"]

    # ── Audit schemas ──────────────────────────────────────
    AuditLog:
      type: object
      required: [id, userId, action, resource, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Notification schemas ───────────────────────────────
    Notification:
      type: object
      required: [id, title, message, type, read, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [info, warning, error, success]
        read:
          type: boolean
        link:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Maintenance schemas ────────────────────────────────
    MaintenanceMode:
      type: object
      required: [enabled, message, updatedAt]
      properties:
        enabled:
          type: boolean
        message:
          type: string
        estimatedEnd:
          type: ["string", "null"]
        updatedAt:
          type: string

    MaintenanceModeInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        message:
          type: string
        estimatedEnd:
          type: ["string", "null"]

    # ── Dashboard summary schemas ──────────────────────────
    AdminDashboard:
      type: object
      required: [totalUsers, totalTenants, totalVPS, activeVPS, monthlyRevenue, platformHealth, recentAlerts, recentActivity]
      properties:
        totalUsers:
          type: integer
        totalTenants:
          type: integer
        totalVPS:
          type: integer
        activeVPS:
          type: integer
        monthlyRevenue:
          type: number
        platformHealth:
          type: number
        activeAlerts:
          type: integer
        openConversations:
          type: integer
        newUsersToday:
          type: integer
        recentAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        vpsStats:
          type: object
          properties:
            running:
              type: integer
            stopped:
              type: integer
            error:
              type: integer

    BusinessDashboard:
      type: object
      required: [teamSize, activeConversations, totalLeads, vpsCount, monthlySpend, recentConversations]
      properties:
        teamSize:
          type: integer
        activeConversations:
          type: integer
        totalLeads:
          type: integer
        convertedLeads:
          type: integer
        vpsCount:
          type: integer
        monthlySpend:
          type: number
        recentConversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    AgentDashboard:
      type: object
      required: [assignedConversations, openLeads, resolvedToday, avgResponseTime]
      properties:
        assignedConversations:
          type: integer
        openLeads:
          type: integer
        resolvedToday:
          type: integer
        avgResponseTime:
          type: number
        recentConversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    UserDashboard:
      type: object
      required: [vpsCount, activeVPS, currentPlan, nextInvoiceAmount, nextInvoiceDate]
      properties:
        vpsCount:
          type: integer
        activeVPS:
          type: integer
        currentPlan:
          type: string
        nextInvoiceAmount:
          type: number
        nextInvoiceDate:
          type: string
        vpsInstances:
          type: array
          items:
            $ref: "#/components/schemas/VPSInstance"
