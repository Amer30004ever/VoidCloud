      type: object
      required: [platformHealth, services, checkedAt]
      properties:
        platformHealth:
          type: number
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
        checkedAt:
          type: string

    ServiceHealth:
      type: object
      required: [name, status, responseTime, url]
      properties:
