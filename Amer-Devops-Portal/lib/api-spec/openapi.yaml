        assignedTo:
          type: ["integer", "null"]
        assignedName:
          type: ["string", "null"]
        tenantId:
          type: integer
        lastMessage:
          type: ["string", "null"]
        lastMessageAt:
          type: ["string", "null"]
        unreadCount:
