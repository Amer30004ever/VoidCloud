components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SimpleMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── Auth schemas ─────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        totpCode:
          type: ["string", "null"]

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    TwoFASetup:
      type: object
      required: [secret, qrCodeUrl]
      properties:
        secret:
          type: string
        qrCodeUrl:
          type: string
        recoveryCodes:
          type: array
          items:
            type: string

    TwoFAVerifyInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    # ── User schemas ─────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, AGENT, USER]
        status:
          type: string
          enum: [active, suspended, pending]
        tenantId:
          type: ["integer", "null"]
        tenantName:
          type: ["string", "null"]
        twoFaEnabled:
          type: boolean
        createdAt:
          type: string
        lastLogin:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [email, name, role, password]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
        password:
          type: string
        tenantId:
          type: ["integer", "null"]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        status:
          type: string
        tenantId:
          type: ["integer", "null"]

    # ── Tenant schemas ────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, subdomain, status, plan, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        subdomain:
          type: string
        status:
          type: string
          enum: [active, suspended, trial]
        plan:
          type: string
        userCount:
          type: integer
        vpsCount:
          type: integer
        monthlyRevenue:
          type: number
        createdAt:
          type: string
        settings:
          type: object
          additionalProperties: true

    TenantInput:
      type: object
      required: [name, subdomain, plan]
      properties:
        name:
          type: string
        subdomain:
          type: string
        plan:
          type: string
        adminEmail:
          type: ["string", "null"]

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        plan:
          type: string
        settings:
          type: object
          additionalProperties: true

    TenantQuota:
      type: object
      required: [tenantId, cpuLimit, ramLimit, diskLimit, vpsLimit, cpuUsed, ramUsed, diskUsed, vpsCount]
      properties:
        tenantId:
          type: integer
        cpuLimit:
          type: integer
        ramLimit:
          type: integer
        diskLimit:
          type: integer
        vpsLimit:
          type: integer
        cpuUsed:
          type: integer
        ramUsed:
          type: integer
        diskUsed:
          type: integer
        vpsCount:
          type: integer

    TenantQuotaInput:
      type: object
      properties:
        cpuLimit:
          type: integer
        ramLimit:
          type: integer
        diskLimit:
          type: integer
        vpsLimit:
          type: integer

    # ── Cluster schemas ───────────────────────────────────
    Cluster:
      type: object
      required: [id, name, host, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        status:
          type: string
          enum: [online, offline, degraded]
        nodeCount:
          type: integer
        totalCpu:
          type: integer
        totalRam:
          type: integer
        totalDisk:
          type: integer
        usedCpu:
          type: integer
        usedRam:
          type: integer
        usedDisk:
          type: integer
        vmCount:
          type: integer
        createdAt:
          type: string

    ClusterInput:
      type: object
      required: [name, host, username, password]
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        tokenId:
          type: ["string", "null"]
        tokenSecret:
          type: ["string", "null"]

    ClusterUpdate:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string

    ClusterHealth:
      type: object
      required: [clusterId, status, cpuPercent, ramPercent, diskPercent]
      properties:
        clusterId:
          type: integer
        status:
          type: string
        cpuPercent:
          type: number
        ramPercent:
          type: number
        diskPercent:
          type: number
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ProxmoxNode"

    ProxmoxNode:
      type: object
      required: [id, name, status, cpu, mem, disk]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        cpu:
          type: number
        mem:
          type: integer
        maxmem:
          type: integer
        disk:
          type: integer
        maxdisk:
          type: integer
        uptime:
          type: integer

    ProxmoxVM:
      type: object
      required: [vmid, name, status, cpu, mem, type]
      properties:
        vmid:
          type: integer
        name:
          type: string
        status:
          type: string
        cpu:
          type: number
        mem:
          type: integer
        maxmem:
          type: integer
        disk:
          type: integer
        type:
          type: string

    # ── VPS schemas ───────────────────────────────────────
    VPSInstance:
      type: object
      required: [id, name, status, cpu, ram, disk, os, ip, clusterId, tenantId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [running, stopped, provisioning, error, deleted]
        cpu:
          type: integer
        ram:
          type: integer
        disk:
          type: integer
        os:
          type: string
        ip:
          type: string
        clusterId:
          type: integer
        clusterName:
          type: ["string", "null"]
        tenantId:
          type: integer
        userId:
          type: integer
        vmid:
          type: integer
        node:
          type: string
        planId:
          type: ["integer", "null"]
        planName:
          type: ["string", "null"]
        createdAt:
          type: string
        uptime:
          type: ["integer", "null"]

    VPSProvisionInput:
      type: object
      required: [name, cpu, ram, disk, os, clusterId]
      properties:
        name:
          type: string
        cpu:
          type: integer
        ram:
          type: integer
        disk:
          type: integer
        os:
          type: string
        clusterId:
          type: integer
        planId:
          type: ["integer", "null"]
        tenantId:
          type: ["integer", "null"]
        userId:
          type: ["integer", "null"]
        ip:
          type: ["string", "null"]

    VPSStats:
      type: object
      required: [cpuPercent, ramPercent, diskPercent, networkIn, networkOut]
      properties:
        cpuPercent:
          type: number
        ramPercent:
          type: number
        diskPercent:
          type: number
        networkIn:
          type: number
        networkOut:
          type: number
        uptime:
          type: integer

    Snapshot:
      type: object
      required: [id, name, vpsId, size, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        vpsId:
          type: integer
        size:
          type: integer
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    SnapshotInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    # ── Plan schemas ──────────────────────────────────────
    Plan:
      type: object
      required: [id, name, price, cpu, ram, disk, bandwidth]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        cpu:
          type: integer
        ram:
          type: integer
        disk:
          type: integer
        bandwidth:
          type: integer
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        subscriberCount:
          type: integer

    PlanInput:
      type: object
      required: [name, price, cpu, ram, disk, bandwidth]
      properties:
        name:
          type: string
        price:
          type: number
        cpu:
          type: integer
        ram:
          type: integer
        disk:
          type: integer
        bandwidth:
          type: integer
        features:
          type: array
          items:
            type: string

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        isActive:
          type: boolean
        features:
          type: array
          items:
            type: string

    # ── Billing schemas ────────────────────────────────────
    Invoice:
      type: object
      required: [id, tenantId, amount, status, dueDate, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        tenantName:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [paid, unpaid, overdue, cancelled]
        dueDate:
          type: string
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    Subscription:
      type: object
      required: [id, tenantId, planId, status, startDate]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        tenantName:
          type: string
        planId:
          type: integer
        planName:
          type: string
        status:
          type: string
          enum: [active, cancelled, past_due, trialing]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        amount:
          type: number

    RevenueDashboard:
      type: object
      required: [mrr, arr, churnRate, totalRevenue, activeSubscriptions, failedPayments]
      properties:
        mrr:
          type: number
        arr:
          type: number
        churnRate:
          type: number
        totalRevenue:
          type: number
        activeSubscriptions:
          type: integer
        failedPayments:
          type: integer
        topTenants:
          type: array
          items:
            $ref: "#/components/schemas/TopTenant"
        revenueByMonth:
