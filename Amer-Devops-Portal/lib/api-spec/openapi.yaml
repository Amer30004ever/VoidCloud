          type: string
        ready:
          type: string
        restarts:
          type: integer
        age:
          type: string
        node:
          type: string
        cpu:
          type: ["string", "null"]
        memory:
          type: ["string", "null"]

    PodLogs:
      type: object
      required: [podName, namespace, logs]
      properties:
        podName:
          type: string
        namespace:
          type: string
        logs:
          type: string

    Alert:
      type: object
      required: [id, name, severity, status, message, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        status:
          type: string
          enum: [firing, resolved]
        message:
          type: string
        service:
          type: ["string", "null"]
        createdAt:
          type: string
        resolvedAt:
          type: ["string", "null"]

    RateLimitStats:
      type: object
      required: [topIPs, blockedIPs, requestsPerMinute, abusiveTenantsCount]
      properties:
        topIPs:
          type: array
          items:
            $ref: "#/components/schemas/IPStat"
        blockedIPs:
          type: array
          items:
            type: string
        requestsPerMinute:
          type: number
        abusiveTenantsCount:
          type: integer
        tenantRates:
          type: array
          items:
            $ref: "#/components/schemas/TenantRate"

    IPStat:
      type: object
      required: [ip, requests, blocked]
      properties:
