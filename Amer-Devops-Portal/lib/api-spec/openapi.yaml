          type: string

    LeadInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        source:
          type: string
        value:
          type: number
        notes:
          type: string

    LeadUpdate:
      type: object
      properties:
        status:
