        source:
          type: ["string", "null"]
        assignedTo:
          type: ["integer", "null"]
        assignedName:
          type: ["string", "null"]
        tenantId:
          type: integer
        notes:
          type: ["string", "null"]
        value:
          type: ["number", "null"]
