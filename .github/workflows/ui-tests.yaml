name: UI Regression Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run start -- -p 8080 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && echo "frontend up" && exit 0
            sleep 2
          done
          echo "frontend failed to start"; cat /tmp/frontend.log; exit 1

      - name: Run Playwright UI regression tests
        working-directory: tests/e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test --workers=3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
          retention-days: 7

      - name: Upload frontend server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: /tmp/frontend.log
          retention-days: 7
