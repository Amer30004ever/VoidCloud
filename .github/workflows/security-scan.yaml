name: Security Scan

# Runs on every push / PR. Fails loudly if a secret pattern is detected in the diff
# or in the tree. Enforces the "no secrets in git" rule from the security backlog.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Free/self-hosted mode — no license required for public/private repo scanning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
        with:
          config-path: .gitleaks.toml

  self-test-injected-secret:
    name: Verify scanner detects an injected fake secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Inject a fake AWS key and confirm the scanner catches it
        run: |
          set -e
          mkdir -p .ci-selftest
          cat > .ci-selftest/leaked.txt <<'EOF'
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          EOF
          # Scan should FAIL (exit != 0) — that means detection works.
          if gitleaks detect --no-git --source=.ci-selftest --config=.gitleaks.toml -v; then
            echo "❌ Self-test FAILED: gitleaks did not detect the injected fake secret."
            exit 1
          else
            echo "✅ Self-test passed: gitleaks correctly detected the injected secret."
          if gitleaks detect --no-git --source=.ci-selftest --config=.gitleaks.toml -v; then
            echo "❌ Self-test FAILED: gitleaks did not detect the injected fake secret."
            exit 1
          else
            echo "✅ Self-test passed: gitleaks correctly detected the injected secret."
          fi

  rbac-scan:
    name: RBAC controller scan (no undecorated routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run RBAC scanner (baseline mode)
        run: node scripts/scan-controller-auth.mjs

