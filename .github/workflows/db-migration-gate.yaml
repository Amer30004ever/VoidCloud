name: DB Migration Gate

# Builds a database from a completely empty state by applying every migration
# in order, then checks the resulting schema against schema.prisma for drift.
# Same discipline as the service runtime gate, but for schema instead of code.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "database/prisma/**"
      - ".github/workflows/db-migration-gate.yaml"
  workflow_dispatch:

jobs:
  fresh-database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: void_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: void_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/void_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Step 1 — raw SQL replay. Every migration.sql must apply, in order,
      # against an empty database. ON_ERROR_STOP turns any SQL error into a
      # non-zero exit, so a broken or out-of-order migration fails the build.
      - name: Apply every migration from empty state
        run: |
          set -euo pipefail
          cd database/prisma/migrations
          count=0
          for dir in $(ls -d */ | sort); do
            echo "::group::$dir"
            psql -v ON_ERROR_STOP=1 -q -f "$dir/migration.sql"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Applied $count migrations to a fresh database."

      # Step 2 — prisma must agree that the replayed history is complete.
      # `migrate deploy` on the already-replayed DB is skipped; instead we
      # rebuild in a second database through prisma itself so the
      # _prisma_migrations bookkeeping is exercised too.
      - name: Rebuild through prisma migrate deploy
        working-directory: database
        run: |
          set -euo pipefail
          psql -c 'CREATE DATABASE void_ci_prisma'
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/void_ci_prisma \
            npx --yes prisma@6.19.3 migrate deploy

      # Step 3 — drift gate. The schema produced by migration history must
      # match schema.prisma exactly. Any diff exits non-zero.
      - name: Fail on schema drift
        working-directory: database
        run: |
          set -euo pipefail
          npx --yes prisma@6.19.3 migrate diff \
            --from-url "postgresql://postgres:postgres@127.0.0.1:5432/void_ci_prisma" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            --script > /tmp/drift.sql && echo "No drift." && exit 0

          echo "::error::Schema drift detected between migration history and schema.prisma"
          cat /tmp/drift.sql
          exit 1

      # Step 4 — the restore drill's safety net is only as good as its manifest.
      # Regenerate the expected-table list and fail if it drifted from the repo.
      - name: Expected-tables manifest is up to date
        run: |
          set -euo pipefail
          node database/scripts/generate-expected-tables.mjs
          if ! git diff --quiet -- database/scripts/expected-tables.txt kubernetes/postgres/expected-tables-configmap.yaml; then
            echo "::error::expected-tables manifest is stale — run node database/scripts/generate-expected-tables.mjs and commit the result"
            git --no-pager diff -- database/scripts/expected-tables.txt kubernetes/postgres/expected-tables-configmap.yaml
            exit 1
          fi
          echo "Manifest up to date."

      # Step 5 — exercise the staging drift gate itself against the freshly
      # built CI database, so the script that guards staging is proven to run.
      - name: Drift gate self-check (CI database)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/void_ci_prisma
          DRIFT_TARGET_LABEL: ci-fresh
        run: bash scripts/check-migration-drift.sh

  staging-drift:
    # Read-only drift check against the real staging database. Runs only when
    # STAGING_DATABASE_URL is configured; fails the build on any drift.
    runs-on: ubuntu-latest
    needs: fresh-database
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Fails loudly (not a silent skip) when STAGING_DATABASE_URL is missing
      # or malformed, naming the secret and where to set it.
      - name: Validate required secrets
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/check-required-secrets.mjs --profile staging-drift

      - name: prisma migrate status + diff against staging
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DRIFT_TARGET_LABEL: staging
        run: bash scripts/check-migration-drift.sh
