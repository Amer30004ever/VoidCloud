name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'rollout-backend'
        type: choice
        options:
          - full-deploy
          - rollout-backend
          - rollout-frontend
          - rollout-all
          - restart-backend
          - restart-frontend
          - restart-all
      backend_image:
        description: 'Backend image tag (optional)'
        required: false
        type: string
        default: 'latest'
      frontend_image:
        description: 'Frontend image tag (optional)'
        required: false
        type: string
        default: 'latest'
      force_pull:
        description: 'Force pull new images (remove only Amer Portal images)'
        required: false
        type: boolean
        default: true

  # 🚀 AUTO-TRIGGER: When CI successfully completes
  workflow_run:
    workflows: ["CI - Test & Build"]
    types:
      - completed
    branches: [feature/devops-portal-features]

permissions:
  actions: read
  contents: read

env:
  DOCKER_HUB_USERNAME: amer30004ever
  DOCKER_HUB_REPO: amer-portal
  NAMESPACE: amer-portal

jobs:
  # ============================================
  # AUTO-DEPLOY BACKEND (when CI built backend)
  # ============================================
  auto-deploy-backend:
    runs-on: self-hosted
    if: |
      (github.event_name == 'workflow_run') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_type == 'rollout-backend' || github.event.inputs.deploy_type == 'rollout-all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Set deployment info
        id: deployment_info
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "type=auto-backend" >> $GITHUB_OUTPUT
            echo "DEPLOY_TYPE=Auto-deploy (CI trigger)" >> $GITHUB_OUTPUT
            # Always use latest for auto-deploy
            BACKEND_IMAGE="latest"
          else
            echo "type=manual-backend" >> $GITHUB_OUTPUT
            echo "DEPLOY_TYPE=Manual deployment" >> $GITHUB_OUTPUT
            BACKEND_IMAGE="${{ github.event.inputs.backend_image }}"
          fi
          echo "backend_image=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "Using backend image: ${BACKEND_IMAGE}"

      - name: Remove old Amer Portal backend images
        if: github.event_name == 'workflow_run' || github.event.inputs.force_pull == 'true'
        run: |
          echo "🗑️ Removing only Amer Portal backend images from cluster nodes..."
          
          NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
          
          for NODE in $NODES; do
            echo "Cleaning backend images on node: $NODE"
            ssh -o StrictHostKeyChecking=no $NODE "sudo crictl images | grep 'amer-portal-backend' | awk '{print \$3}' | xargs -r sudo crictl rmi" 2>/dev/null || echo "⚠️ Could not clean images on $NODE"
          done
          
          echo "✅ Backend images cleaned from nodes"

      - name: Deploy Backend
        run: |
          echo "🚀 Deploying backend..."
          echo "Image tag: ${{ steps.deployment_info.outputs.backend_image }}"
          
          # Ensure namespace exists
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply backend configuration (migrations run in container entrypoint: prisma migrate deploy)
          kubectl apply -f kubernetes/backend/service.yaml 2>/dev/null || true
          
          # Apply deployment
          kubectl apply -f kubernetes/backend/deployment.yaml
          
          # Set imagePullPolicy to Always
          kubectl patch deployment backend -n ${{ env.NAMESPACE }} -p '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"Always"}]}}}}'
          
          # Update image tag if specified and not latest
          BACKEND_IMG="${{ steps.deployment_info.outputs.backend_image }}"
          if [ "$BACKEND_IMG" != "latest" ] && [ "$BACKEND_IMG" != "" ] && [ "$BACKEND_IMG" != "null" ]; then
            echo "🔄 Updating backend image to: $BACKEND_IMG"
            kubectl set image deployment/backend -n ${{ env.NAMESPACE }} \
              backend=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}-backend:${BACKEND_IMG}
          else
            echo "📦 Using latest image tag"
            kubectl set image deployment/backend -n ${{ env.NAMESPACE }} \
              backend=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}-backend:latest
          fi
          
          # Rollout restart
          echo "🔄 Rolling out backend..."
          kubectl rollout restart deployment/backend -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s
          
          echo "✅ Backend deployment complete!"

  # ============================================
  # AUTO-DEPLOY FRONTEND (when CI built frontend)
  # ============================================
  auto-deploy-frontend:
    runs-on: self-hosted
    if: |
      (github.event_name == 'workflow_run') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_type == 'rollout-frontend' || github.event.inputs.deploy_type == 'rollout-all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Set deployment info
        id: deployment_info
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "type=auto-frontend" >> $GITHUB_OUTPUT
            echo "DEPLOY_TYPE=Auto-deploy (CI trigger)" >> $GITHUB_OUTPUT
            # Always use latest for auto-deploy
            FRONTEND_IMAGE="latest"
          else
            echo "type=manual-frontend" >> $GITHUB_OUTPUT
            echo "DEPLOY_TYPE=Manual deployment" >> $GITHUB_OUTPUT
            FRONTEND_IMAGE="${{ github.event.inputs.frontend_image }}"
          fi
          echo "frontend_image=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "Using frontend image: ${FRONTEND_IMAGE}"

      - name: Remove old Amer Portal frontend images
        if: github.event_name == 'workflow_run' || github.event.inputs.force_pull == 'true'
        run: |
          echo "🗑️ Removing only Amer Portal frontend images from cluster nodes..."
          
          NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
          
          for NODE in $NODES; do
            echo "Cleaning frontend images on node: $NODE"
            ssh -o StrictHostKeyChecking=no $NODE "sudo crictl images | grep 'amer-portal-frontend' | awk '{print \$3}' | xargs -r sudo crictl rmi" 2>/dev/null || echo "⚠️ Could not clean images on $NODE"
          done
          
          echo "✅ Frontend images cleaned from nodes"

      - name: Deploy Frontend
        run: |
          echo "🚀 Deploying frontend..."
          echo "Image tag: ${{ steps.deployment_info.outputs.frontend_image }}"
          
          # Ensure namespace exists
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply frontend configuration
          kubectl apply -f kubernetes/frontend/service.yaml 2>/dev/null || true
          kubectl apply -f kubernetes/frontend/frontend-nodeport.yaml 2>/dev/null || true
          
          # Apply deployment
          kubectl apply -f kubernetes/frontend/deployment.yaml
          
          # Set imagePullPolicy to Always
          kubectl patch deployment frontend -n ${{ env.NAMESPACE }} -p '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"Always"}]}}}}'
          
          # Update image tag if specified and not latest
          FRONTEND_IMG="${{ steps.deployment_info.outputs.frontend_image }}"
          if [ "$FRONTEND_IMG" != "latest" ] && [ "$FRONTEND_IMG" != "" ] && [ "$FRONTEND_IMG" != "null" ]; then
            echo "🔄 Updating frontend image to: $FRONTEND_IMG"
            kubectl set image deployment/frontend -n ${{ env.NAMESPACE }} \
              frontend=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}-frontend:${FRONTEND_IMG}
          else
            echo "📦 Using latest image tag"
            kubectl set image deployment/frontend -n ${{ env.NAMESPACE }} \
              frontend=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}-frontend:latest
          fi
          
          # Rollout restart
          echo "🔄 Rolling out frontend..."
          kubectl rollout restart deployment/frontend -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s
          
          echo "✅ Frontend deployment complete!"

  # ============================================
  # AUTO-DEPLOY BOTH (when CI built both)
  # ============================================
  # Note: This is handled by the two jobs above running in parallel
  
  # ============================================
  # MANUAL DEPLOYMENT OPTIONS (keep existing)
  # ============================================
  manual-full-deploy:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_type == 'full-deploy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Full Deploy (from scratch)
        run: |
          echo "🚀 Performing full deployment from scratch..."
          
          # Apply namespace
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply secrets and configmaps
          kubectl apply -f kubernetes/configmaps.yaml
          kubectl apply -f kubernetes/secrets.yaml
          
          # Deploy PostgreSQL
          kubectl apply -f kubernetes/postgres/pv.yaml
          kubectl apply -f kubernetes/postgres/pvc.yaml
          kubectl apply -f kubernetes/postgres/deployment.yaml
          kubectl apply -f kubernetes/postgres/service.yaml
          
          # Wait for PostgreSQL
          kubectl wait --for=condition=ready pod -l app=postgres -n ${{ env.NAMESPACE }} --timeout=120s
          
          # Deploy Backend
          kubectl apply -f kubernetes/backend/deployment.yaml
          kubectl apply -f kubernetes/backend/service.yaml
          
          # Set imagePullPolicy to Always for backend
          kubectl patch deployment backend -n ${{ env.NAMESPACE }} -p '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"Always"}]}}}}'
          
          # Wait for Backend
          kubectl wait --for=condition=ready pod -l app=backend -n ${{ env.NAMESPACE }} --timeout=120s
          
          # Deploy Frontend
          kubectl apply -f kubernetes/frontend/deployment.yaml
          kubectl apply -f kubernetes/frontend/service.yaml
          kubectl apply -f kubernetes/frontend/frontend-nodeport.yaml
          
          # Set imagePullPolicy to Always for frontend
          kubectl patch deployment frontend -n ${{ env.NAMESPACE }} -p '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"Always"}]}}}}'
          
          # Wait for Frontend
          kubectl wait --for=condition=ready pod -l app=frontend -n ${{ env.NAMESPACE }} --timeout=120s
          
          # Deploy Ingress
          kubectl apply -f kubernetes/ingress.yaml
          
          echo "✅ Full deployment complete!"

  manual-restart-backend:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_type == 'restart-backend'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Restart Backend
        run: |
          echo "🔄 Restarting backend only..."
          
          if [ "${{ github.event.inputs.force_pull }}" == "true" ]; then
            NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
            for NODE in $NODES; do
              ssh -o StrictHostKeyChecking=no $NODE "sudo crictl images | grep 'amer-portal-backend' | awk '{print \$3}' | xargs -r sudo crictl rmi" 2>/dev/null || true
            done
          fi
          
          kubectl rollout restart deployment/backend -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s
          echo "✅ Backend restarted!"

  manual-restart-frontend:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_type == 'restart-frontend'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Restart Frontend
        run: |
          echo "🔄 Restarting frontend only..."
          
          if [ "${{ github.event.inputs.force_pull }}" == "true" ]; then
            NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
            for NODE in $NODES; do
              ssh -o StrictHostKeyChecking=no $NODE "sudo crictl images | grep 'amer-portal-frontend' | awk '{print \$3}' | xargs -r sudo crictl rmi" 2>/dev/null || true
            done
          fi
          
          kubectl rollout restart deployment/frontend -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s
          echo "✅ Frontend restarted!"

  manual-restart-all:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_type == 'restart-all'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Restart All Deployments
        run: |
          echo "🔄 Restarting all deployments..."
          
          if [ "${{ github.event.inputs.force_pull }}" == "true" ]; then
            NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
            for NODE in $NODES; do
              ssh -o StrictHostKeyChecking=no $NODE "sudo crictl images | grep 'amer-portal' | awk '{print \$3}' | xargs -r sudo crictl rmi" 2>/dev/null || true
            done
          fi
          
          kubectl rollout restart deployment -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s
          echo "✅ All deployments restarted!"

  # ============================================
  # VERIFICATION & SUMMARY
  # ============================================
  verify-deployment:
    needs: [auto-deploy-backend, auto-deploy-frontend, manual-full-deploy, manual-restart-backend, manual-restart-frontend, manual-restart-all]
    runs-on: self-hosted
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify deployment
        run: |
          echo ""
          echo "========================================="
          echo "📊 Deployment Status"
          echo "========================================="
          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo ""
          echo "Ingress:"
          kubectl get ingress -n ${{ env.NAMESPACE }}
          echo ""
          
          echo "🏥 Running health checks..."
          sleep 10
          
          # Check backend health
          BACKEND_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=backend -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$BACKEND_POD" ]; then
            kubectl exec -n ${{ env.NAMESPACE }} $BACKEND_POD -- curl -s http://localhost:3001/api/v1/health 2>/dev/null && echo "✅ Backend healthy" || echo "⚠️ Backend health check failed"
          fi
          
          # Check frontend
          FRONTEND_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=frontend -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$FRONTEND_POD" ]; then
            echo "✅ Frontend running"
          fi
          
          echo "✅ Deployment verification complete!"

      - name: Deployment summary
        run: |
          echo ""
          echo "========================================="
          echo "🎉 Deployment Complete!"
          echo "========================================="
          echo ""
          echo "Trigger: ${{ github.event_name }}"
          
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "Type: Auto-deployment from CI pipeline"
            echo "CI Workflow: ${{ github.event.workflow_run.name }}"
            echo "CI Status: ${{ github.event.workflow_run.conclusion }}"
          else
            echo "Type: Manual deployment"
            echo "Deployment type: ${{ github.event.inputs.deploy_type }}"
            echo "Backend image: ${{ github.event.inputs.backend_image }}"
            echo "Frontend image: ${{ github.event.inputs.frontend_image }}"
            echo "Force pull: ${{ github.event.inputs.force_pull }}"
          fi
          
          echo ""
          echo "🌐 Access URLs:"
          echo "   https://amer-portal.cc.cd"
          echo "   https://api.amer-portal.cc.cd/api/v1/health"
          echo ""
          echo "🔐 Admin Login:"
          echo "   Email: admin@amer.dev"
          echo "   Password: AmerDevOps2026!"
          echo ""
          echo "========================================="