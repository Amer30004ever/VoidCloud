name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: voidcloud

jobs:
  test-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth
          - user
          - tenant
          - vps
          - billing
          - crm
          - whatsapp
          - email
          - notification
          - monitoring
          - audit
          - analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build service
        run: |
          cd services/${{ matrix.service }}
          npm ci
          npm run build

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.voidcloud.cc.cd/api/v1
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: [test-services, test-frontend]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: auth
            dockerfile: services/auth/Dockerfile
            tag: auth-service
          - name: user
            dockerfile: services/user/Dockerfile
            tag: user-service
          - name: tenant
            dockerfile: services/tenant/Dockerfile
            tag: tenant-service
          - name: vps
            dockerfile: services/vps/Dockerfile
            tag: vps-service
          - name: billing
            dockerfile: services/billing/Dockerfile
            tag: billing-service
          - name: crm
            dockerfile: services/crm/Dockerfile
            tag: crm-service
          - name: whatsapp
            dockerfile: services/whatsapp/Dockerfile
            tag: whatsapp-service
          - name: email
            dockerfile: services/email/Dockerfile
            tag: email-service
          - name: notification
            dockerfile: services/notification/Dockerfile
            tag: notification-service
          - name: monitoring
            dockerfile: services/monitoring/Dockerfile
            tag: monitoring-service
          - name: audit
            dockerfile: services/audit/Dockerfile
            tag: audit-service
          - name: analytics
            dockerfile: services/analytics/Dockerfile
            tag: analytics-service
          - name: database
            dockerfile: database/Dockerfile
            context: database
            tag: database
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            tag: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.tag }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/secrets.yaml
          kubectl apply -f kubernetes/configmaps.yaml
          kubectl apply -f kubernetes/postgres/
          kubectl apply -f kubernetes/redis/
          kubectl apply -f kubernetes/rabbitmq/
          kubectl apply -f kubernetes/ingress.yaml
          for d in auth user tenant vps billing crm whatsapp email notification monitoring audit analytics frontend; do
            kubectl apply -f kubernetes/$d/
          done
          kubectl apply -f kubernetes/migrate-job.yaml
          kubectl -n voidcloud rollout status deploy/auth-service --timeout=180s
