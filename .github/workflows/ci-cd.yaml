name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: voidcloud

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth
          - user
          - tenant
          - vps
          - billing
          - crm
          - whatsapp
          - email
          - notification
          - monitoring
          - audit
          - analytics
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

  deploy:
    needs: [build-services, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
      - name: Deploy all services
        run: |
          export KUBECONFIG=kubeconfig
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/secrets.yaml
          kubectl apply -f kubernetes/configmaps.yaml
          kubectl apply -f kubernetes/ingress.yaml
          kubectl apply -f kubernetes/redis/
          kubectl apply -f kubernetes/rabbitmq/
          kubectl apply -f kubernetes/auth/
          kubectl apply -f kubernetes/user/
          kubectl apply -f kubernetes/tenant/
          kubectl apply -f kubernetes/vps/
          kubectl apply -f kubernetes/billing/
          kubectl apply -f kubernetes/crm/
          kubectl apply -f kubernetes/whatsapp/
          kubectl apply -f kubernetes/email/
          kubectl apply -f kubernetes/notification/
          kubectl apply -f kubernetes/monitoring/
          kubectl apply -f kubernetes/audit/
          kubectl apply -f kubernetes/analytics/
          kubectl apply -f kubernetes/frontend/
          kubectl -n voidcloud rollout status deploy/auth-service --timeout=120s
