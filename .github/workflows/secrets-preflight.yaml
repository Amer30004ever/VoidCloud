name: Secrets Preflight

# Validates that the secrets required by infra jobs exist and are well-formed,
# with a clear message naming each missing value and where to set it.
# Reusable: other workflows call it via `uses: ./.github/workflows/secrets-preflight.yaml`.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail (instead of warn) when a secret is missing"
        type: boolean
        default: true
  workflow_call:
    inputs:
      profiles:
        type: string
        default: "staging-drift oidc"
      strict:
        type: boolean
        default: true
    secrets:
      STAGING_DATABASE_URL:
        required: false
      GITEA_URL:
        required: false
      GITEA_ADMIN_TOKEN:
        required: false
  push:
    branches: [main]
    paths:
      - "scripts/check-required-secrets.mjs"
      - ".github/workflows/secrets-preflight.yaml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [staging-drift, oidc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check ${{ matrix.profile }} secrets
        if: ${{ !inputs.profiles || contains(inputs.profiles, matrix.profile) }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_ADMIN_TOKEN: ${{ secrets.GITEA_ADMIN_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.strict }}" = "false" ]; then FLAGS="--optional"; fi
          node scripts/check-required-secrets.mjs --profile "${{ matrix.profile }}" $FLAGS
