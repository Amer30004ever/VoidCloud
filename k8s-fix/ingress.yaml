apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amer-portal-ingress
  namespace: amer-portal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-security-headers@kubernetescrd,traefik-rate-limit@kubernetescrd"
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: voidcloud.cc.cd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: www.voidcloud.cc.cd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.voidcloud.cc.cd
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
  tls:
    - hosts:
        - voidcloud.cc.cd
        - www.voidcloud.cc.cd
        - api.voidcloud.cc.cd
      secretName: voidcloud-tls
